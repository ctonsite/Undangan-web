<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Undangan</title>
<style>
  body{margin:0; text-align:center; padding:60px 20px; font-family:sans-serif; background:#FDFBF7}
  .btn{background:#C9A961; color:white; padding:16px 32px; border-radius:50px; border:none; cursor:pointer; font-size:18px; font-weight:bold}
  .btn2{background:#8B7355; color:white; padding:14px 28px; border-radius:50px; border:none; cursor:pointer; font-size:16px; font-weight:bold; margin-top:15px}
  #player{position:absolute; width:1px; height:1px; overflow:hidden}
  #cover{position:fixed; top:0; left:0; width:100%; height:100%; background:#FDFBF7; display:flex; justify-content:center; align-items:center; z-index:999}
  #isi{padding-top:40px; display:none;}
</style>
</head>
<body>

<div id="cover">
  <div>
    <div id="player">
      <iframe width="1" height="1" 
      src="https://www.youtube.com/embed/--FGrXJjPqk?autoplay=1&mute=1&loop=1&playlist=--FGrXJjPqk" 
      frameborder="0" allow="autoplay"></iframe>
    </div>
    
    <h2 style="color:#C9A961;">Undangan Pernikahan</h2>
    <button class="btn" onclick="bukaUndangan()">🎵 BUKA UNDANGAN</button>
  </div>
</div>

<div id="isi">
  <h1>Terima Kasih Sudah Datang</h1>
  <p>Silakan buka undangan lengkap di bawah</p>
  <button class="btn2" onclick="keGoogleSites()">📜 Buka Undangan Lengkap</button>
  <p style="font-size:12px; color:#666;">Musik akan tetap jalan di halaman ini</p>
</div>

<script>
  function bukaUndangan(){
    // 1. Unmute musik
    document.querySelector('iframe').src = "https://www.youtube.com/embed/--FGrXJjPqk?autoplay=1&loop=1&playlist=--FGrXJjPqk";
    // 2. Hilangkan cover
    document.getElementById('cover').style.display = 'none';
    // 3. Munculkan isi + tombol ke Google Sites
    document.getElementById('isi').style.display = 'block';
  }

  <section id="rsvp">
  <h2>RSVP Acara</h2>
  <p>Mohon konfirmasi kehadiran kamu ya 🙏</p>
  
  <!-- Ganti link ini dengan link Google Form kamu -->
  <iframe src="https://docs.google.com/forms/d/e/FORM_ID_KAMU/viewform?embedded=true" 
    width="100%" height="600" frameborder="0" marginheight="0" marginwidth="0">
    Memuat…
  </iframe>
  
  <h3>Tally Kehadiran</h3>
  <p>Lihat rekap jawaban di: <a href="LINK_GOOGLE_SHEET_KAMU" target="_blank">Google Sheets</a></p>
</section>
</script>
</body>
</html>
