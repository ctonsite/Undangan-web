<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Undangan Digital</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
    body { background: #fdf6f0; color: #333; }
    
    /* Halaman Pembuka */
    #cover {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)), url('https://images.unsplash.com/photo-1519225421980-715cb0215aed?q=80') center/cover;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      color: white; text-align: center; z-index: 999;
      transition: opacity 1s ease;
    }
    #cover h1 { font-size: 2.5rem; margin-bottom: 10px; }
    #cover p { font-size: 1.2rem; margin-bottom: 30px; }
    .btn-buka {
      background: #d4a373; color: white; padding: 15px 40px; border: none;
      border-radius: 50px; font-size: 1.1rem; cursor: pointer; font-weight: bold;
      transition: transform 0.2s;
    }
    .btn-buka:hover { transform: scale(1.05); background: #c98a5d; }

    /* Isi Undangan */
    #content {
      display: none;
      padding: 40px 20px;
      max-width: 800px;
      margin: auto;
      animation: fadeIn 1.5s;
    }
    @keyframes fadeIn { from {opacity: 0;} to {opacity: 1;} }
    h2 { text-align: center; color: #b08968; margin-bottom: 20px; }
    
    .form-container {
      background: white; padding: 20px; border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }
    iframe { width: 100%; border: none; border-radius: 8px; }
    footer { text-align: center; padding: 30px; color: #777; }

    /* TOMBOL PAUSE MUSIK */
    #btn-musik {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #d4a373;
      color: white;
      border: none;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      font-size: 24px;
      cursor: pointer;
      z-index: 1000;
      display: none; /* disembunyikan dulu */
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }
    #btn-musik:hover { background: #c98a5d; }
  </style>
</head>
<body>

  <!-- HALAMAN 1: COVER + TOMBOL -->
  <div id="cover">
    <h1>Undangan Pernikahan</h1>
    <p>Kami mengundang Anda</p>
    <button class="btn-buka" onclick="bukaUndangan()">Buka Undangan</button>
  </div>

  <!-- HALAMAN 2: ISI + GOOGLE FORM + MUSIK -->
  <div id="content">
    <h2>RSVP Kehadiran</h2>
    <p style="text-align:center; margin-bottom:20px;">Mohon konfirmasi kehadiran Anda melalui form di bawah ini 🙏</p>
    
    <div class="form-container">
      <iframe src="https://docs.google.com/forms/d/e/1FAIpQLSfwvSaSDbl5eOLO5cM_pOx2OCgB-Vd5IPyX1vqBI_1WmZiFzQ/viewform?embedded=true" 
        height="1200">
        Memuat...
      </iframe>
    </div>

    <footer>
      <p>Terima Kasih ❤️</p>
    </footer>
  </div>

  <!-- TOMBOL PAUSE/PLAY -->
  <button id="btn-musik" onclick="toggleMusik()">🔊</button>

  <!-- MUSIK LATAR DARI YOUTUBE -->
  <iframe id="music" width="0" height="0" 
    src="" 
    frameborder="0" 
    allow="autoplay">
  </iframe>

  <script>
    let musikNyala = true;

    function bukaUndangan() {
      // 1. Sembunyikan cover
      document.getElementById('cover').style.opacity = '0';
      setTimeout(() => {
        document.getElementById('cover').style.display = 'none';
        document.getElementById('content').style.display = 'block';
        document.getElementById('btn-musik').style.display = 'block'; // tampilkan tombol musik
      }, 1000);

      // 2. Putar musik youtube
      document.getElementById('music').src = "https://www.youtube.com/embed/--FGrXJjPqk?autoplay=1&loop=1&playlist=--FGrXJjPqk&controls=0";
    }

    function toggleMusik() {
      const musicFrame = document.getElementById('music');
      const btn = document.getElementById('btn-musik');
      
      if (musikNyala) {
        // Pause: kosongkan src biar stop
        musicFrame.src = "";
        btn.innerHTML = "🔇";
        musikNyala = false;
      } else {
        // Play: isi lagi src nya
        musicFrame.src = "https://www.youtube.com/embed/--FGrXJjPqk?autoplay=1&loop=1&playlist=--FGrXJjPqk&controls=0";
        btn.innerHTML = "🔊";
        musikNyala = true;
      }
    }
  </script>

</body>
</html>
