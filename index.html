<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Undangan Digital</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
    body { background: #fdf6f0; color: #333; }
    
    #cover {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)), url('https://images.unsplash.com/photo-1519225421980-715cb0215aed?q=80') center/cover;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      color: white; text-align: center; z-index: 999;
      transition: opacity 1s ease;
    }
    .btn-buka {
      background: #d4a373; color: white; padding: 15px 40px; border: none;
      border-radius: 50px; font-size: 1.1rem; cursor: pointer; font-weight: bold;
    }

    #content {
      display: none;
      padding: 40px 20px;
      max-width: 800px;
      margin: auto;
    }
    
    .form-container {
      background: white; padding: 20px; border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    /* FIX UNTUK GOOGLE FORM */
    .iframe-wrapper {
      width: 100%;
      height: 1200px; /* tinggi awal */
      overflow: hidden;
    }
    .iframe-wrapper iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
    .btn-link {
      display: block;
      text-align: center;
      margin-top: 15px;
      color: #d4a373;
      font-weight: bold;
      text-decoration: none;
    }

    #btn-musik {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #d4a373;
      color: white;
      border: none;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      font-size: 24px;
      cursor: pointer;
      z-index: 1000;
      display: none;
    }
  </style>
</head>
<body>

  <div id="cover">
    <h1>Undangan Pernikahan</h1>
    <p>Kami mengundang Anda</p>
    <button class="btn-buka" onclick="bukaUndangan()">Buka Undangan</button>
  </div>

  <div id="content">
    <h2 style="text-align:center; color: #b08968; margin-bottom: 20px;">RSVP Kehadiran</h2>
    <p style="text-align:center; margin-bottom:20px;">Mohon konfirmasi kehadiran Anda 🙏</p>
    
    <div class="form-container">
      <div class="iframe-wrapper">
        <iframe src="https://docs.google.com/forms/d/e/1FAIpQLSfwvSaSDbl5eOLO5cM_pOx2OCgB-Vd5IPyX1vqBI_1WmZiFzQ/viewform?embedded=true" 
          frameborder="0" marginheight="0" marginwidth="0">Memuat...</iframe>
      </div>
      <!-- TOMBOL CADANGAN KALAU IFRAME ERROR -->
      <a href="https://docs.google.com/forms/d/e/1FAIpQLSfwvSaSDbl5eOLO5cM_pOx2OCgB-Vd5IPyX1vqBI_1WmZiFzQ/viewform" 
         target="_blank" class="btn-link">Klik di sini jika form tidak muncul</a>
    </div>

    <footer style="text-align:center; padding:30px; color:#777;"><p>Terima Kasih ❤️</p></footer>
  </div>

  <button id="btn-musik" onclick="toggleMusik()">🔊</button>
  <audio id="musik" loop></audio>

  <script>
    let musikNyala = true;
    const audio = document.getElementById('musik');

    function bukaUndangan() {
      document.getElementById('cover').style.opacity = '0';
      setTimeout(() => {
        document.getElementById('cover').style.display = 'none';
        document.getElementById('content').style.display = 'block';
        document.getElementById('btn-musik').style.display = 'block';
      }, 1000);

      audio.src = "Ten2Five - Hanya Untukmu (Official Music Video) - GP Records128kb.mp3"; 
      audio.play();
    }

    function toggleMusik() {
      const btn = document.getElementById('btn-musik');
      if (musikNyala) {
        audio.pause();
        btn.innerHTML = "🔇";
        musikNyala = false;
      } else {
        audio.play();
        btn.innerHTML = "🔊";
        musikNyala = true;
      }
    }
  </script>

</body>
</html>
