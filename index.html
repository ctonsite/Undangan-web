<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Undangan Digital</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
    body { background: #fdf6f0; color: #333; text-align: center; }
    
    #cover {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)), url('https://images.unsplash.com/photo-1519225421980-715cb0215aed?q=80') center/cover;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      color: white; z-index: 999; transition: opacity 1s ease;
    }
    #cover h1 { font-size: 2.5rem; margin-bottom: 10px; }
    .btn-buka { background: #d4a373; color: white; padding: 15px 40px; border: none; border-radius: 50px; font-size: 1.1rem; cursor: pointer; font-weight: bold; }

    #content {
      display: none;
      padding: 40px 20px;
      max-width: 700px;
      margin: auto;
      animation: fadeIn 1.5s;
    }
    @keyframes fadeIn { from {opacity: 0;} to {opacity: 1;} }

    /* STYLE UNTUK TEKS & GAMBAR */
    .foto-mempelai {
      width: 200px;
      height: 200px;
      border-radius: 50%;
      object-fit: cover;
      border: 5px solid #d4a373;
      margin-bottom: 20px;
    }
    .nama { font-size: 2rem; color: #b08968; font-weight: bold; margin: 10px 0; }
    .tanggal { font-size: 1.2rem; margin-bottom: 30px; color: #777; }
    .ucapan { font-size: 1rem; line-height: 1.8; margin-bottom: 30px; }
    
    .form-container {
      background: white; padding: 20px; border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      margin-top: 30px;
    }
    .iframe-wrapper { width: 100%; height: 1200px; }
    .iframe-wrapper iframe { width: 100%; height: 100%; border: none; }

    #btn-musik {
      position: fixed; bottom: 20px; right: 20px; background: #d4a373;
      color: white; border: none; width: 50px; height: 50px; border-radius: 50%;
      font-size: 24px; cursor: pointer; z-index: 1000; display: none;
    }
  </style>
</head>
<body>

  <div id="cover">
    <h1>Undangan Pernikahan</h1>
    <p>Kami mengundang Anda</p>
    <button class="btn-buka" onclick="bukaUndangan()">Buka Undangan</button>
  </div>

  <div id="content">
    
    <!-- 1. TAMBAH GAMBAR -->
    <img src="foto-kalian.jpg" alt="Foto Mempelai" class="foto-mempelai">

    <!-- 2. TAMBAH TEKS -->
    <h2 class="nama">Andi & Sinta</h2> <!-- GANTI NAMA -->
    <p class="tanggal">Minggu, 15 November 2026</p> <!-- GANTI TANGGAL -->
    
    <p class="ucapan">
      Dengan memohon rahmat dan ridho Allah SWT, <br>
      kami mengundang Bapak/Ibu/Saudara/i <br>
      untuk hadir di acara pernikahan kami.
    </p> <!-- GANTI UCAPAN -->

    <hr style="margin: 40px 0; border: none; border-top: 1px solid #ddd;">

    <!-- 3. GOOGLE FORM RSVP -->
    <h2 style="color: #b08968; margin-bottom: 20px;">RSVP Kehadiran</h2>
    <div class="form-container">
      <div class="iframe-wrapper">
        <iframe src="https://docs.google.com/forms/d/e/1FAIpQLSfwvSaSDbl5eOLO5cM_pOx2OCgB-Vd5IPyX1vqBI_1WmZiFzQ/viewform?embedded=true">Memuat...</iframe>
      </div>
    </div>

    <footer style="padding:30px; color:#777;"><p>Terima Kasih ❤️</p></footer>
  </div>

  <button id="btn-musik" onclick="toggleMusik()">🔊</button>
  <audio id="musik" loop></audio>

  <script>
    let musikNyala = true;
    const audio = document.getElementById('musik');

    function bukaUndangan() {
      document.getElementById('cover').style.opacity = '0';
      setTimeout(() => {
        document.getElementById('cover').style.display = 'none';
        document.getElementById('content').style.display = 'block';
        document.getElementById('btn-musik').style.display = 'block';
      }, 1000);
      audio.src = "musik.mp3"; 
      audio.play();
    }

    function toggleMusik() {
      const btn = document.getElementById('btn-musik');
      if (musikNyala) { audio.pause(); btn.innerHTML = "🔇"; musikNyala = false; } 
      else { audio.play(); btn.innerHTML = "🔊"; musikNyala = true; }
    }
  </script>

</body>
</html>
